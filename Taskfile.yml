# Task runner for supragnosis - https://taskfile.dev  (install: brew install go-task)
# Run `task` with no arguments to list everything.
#
# Two things this file exists to encode:
#
# 1. `task check` is the same gate CI runs, so a green run here means a green run there. It pairs
#    .github/workflows/rust.yml (clippy + tests) with frontend-lint.yml (the viewer's ESLint).
#    Keep them in step: a check added to one belongs in the other.
#
# 2. There is deliberately NO "dev web server" task. The viewer serves HTTP over a unix socket and
#    never over TCP: v0.1.10 removed the TCP bind as a breaking change and DELETED the DNS-rebinding
#    and CSRF gates rather than defending them, so proxying the socket to a port re-exposes that
#    whole attack class undefended. It would also launder the verdict surface ceiling - /api/review
#    grants HumanConfirmed only because the request arrived over the 0600 socket. `task dev` runs
#    the Tauri shell instead, which proxies its own webview onto the socket via viz://. To poke the
#    HTTP API by hand, `task viz -- /api/curation` speaks the socket directly with curl.
#
# No fmt task on purpose: the tree is not rustfmt-managed (cargo fmt --check currently reports ~410
# hunks), so a `task fmt` would tempt an enormous unrelated diff. Format by hand if you need to.

version: '3'

vars:
  # Built by `task build`; also what the desktop shell spawns via SUPRAGNOSIS_BIN.
  SERVER_BIN: ./target/debug/supragnosis
  # Throwaway instance for dev / dev:snapshot / server. Kept off ~/.supragnosis so it never contends with
  # a real daemon for the store's single-writer lock. The socket lives in /tmp because macOS
  # caps sun_path near 104 bytes - a long path fails with a bare "viz bind failed" and no viewer.
  DEV_SOCK: /tmp/supragnosis-dev.sock
  DEV_DATA: /tmp/supragnosis-dev-db
  DEV_HTTP: 127.0.0.1:7399
  # The socket a normally-installed daemon uses. Override by exporting SUPRAGNOSIS_VIZ_SOCK.
  VIZ_SOCK: '${SUPRAGNOSIS_VIZ_SOCK:-$HOME/.supragnosis/viz.sock}'
  # The store a normally-installed daemon uses - the source for dev:snapshot. This is the redb
  # directory, not the pre-0.2 Cozo one beside it: `default_data_dir_for` in the CLI answers
  # ~/.supragnosis/redb for every store kind except the "cozo" name kept for the migration guard.
  # It read .supragnosis/db until 2026-08-23, four releases after Cozo was removed, and the failure
  # was silent - the copied directory holds no knowledge.redb, so the dev daemon creates an empty
  # one and comes up with nothing, which is the one outcome a task promising "real data" must not
  # produce quietly.
  LIVE_DATA: '${SUPRAGNOSIS_DATA_DIR:-$HOME/.supragnosis/redb}'

tasks:
  default:
    desc: List the available tasks
    cmds: [task --list]
    silent: true

  # --- development ------------------------------------------------------------------------------

  # Every env var below is load-bearing. The shell does attach-or-spawn: if the socket it resolves
  # is already answering, it attaches and NEVER consults SUPRAGNOSIS_BIN (app/src/main.rs
  # ensure_daemon). Leaving SUPRAGNOSIS_VIZ_SOCK at its default therefore silently attaches to a
  # normally-installed daemon on ~/.supragnosis/viz.sock and shows you ITS build - you edit code,
  # run this, and stare at stale UI. So dev pins its own socket, db and port and owns the instance.
  # SUPRAGNOSIS_HTTP_ADDR is pinned too: unset, the shell probes :7373 and silently falls back to an
  # ephemeral port when a real daemon holds it. To drive an already-running daemon instead, use
  # `task app` (which is explicit about not building anything).
  dev:
    desc: Run the viewer UI on YOUR build - own db/socket/port, never touches ~/.supragnosis
    deps: [build]
    cmds:
      - >-
        SUPRAGNOSIS_BIN={{.SERVER_BIN}}
        SUPRAGNOSIS_VIZ_SOCK={{.DEV_SOCK}}
        SUPRAGNOSIS_DATA_DIR={{.DEV_DATA}}
        SUPRAGNOSIS_HTTP_ADDR={{.DEV_HTTP}}
        cargo run --manifest-path app/Cargo.toml

  server:
    desc: Run the server alone in the foreground (MCP http + viewer socket), no desktop shell
    deps: [build]
    cmds:
      - '{{.SERVER_BIN}} serve --http {{.DEV_HTTP}} --viz {{.DEV_SOCK}} --data-dir {{.DEV_DATA}}'

  server:mem:
    desc: Foreground server on a non-persistent store - fastest way to try something destructive
    deps: [build]
    cmds:
      - '{{.SERVER_BIN}} serve --http {{.DEV_HTTP}} --viz {{.DEV_SOCK}} --store mem'

  dev:snapshot:
    desc: Run dev on a COPY of the live daemon's knowledge - real data, real build, no risk to either
    deps: [build]
    cmds:
      - task: _snapshot
      - task: dev

  # The store takes a single writer, so a dev instance cannot open the store a running daemon holds.
  # A copy sidesteps that without stopping anything. Note this is a weaker guarantee than the
  # RocksDB-era argument that used to stand here: redb is one file, and `cp` reads it while the
  # writer may still be rewriting pages it already passed, so the result can be torn in a way a
  # power cut is not. What makes that acceptable is that the failure is loud - redb refuses to open
  # a file whose commit slot and pages disagree, so a bad copy is an error at startup, never a
  # quietly short graph. Re-run if it happens, or take the copy while nothing is writing.
  # The copy is a SNAPSHOT in both directions - what you do in dev never reaches the real store, and
  # writes the daemon makes afterwards never reach dev. Re-run to refresh.
  _snapshot:
    internal: true
    cmds:
      - rm -rf {{.DEV_DATA}}
      - cp -R {{.LIVE_DATA}} {{.DEV_DATA}}
      - 'echo "snapshot: {{.LIVE_DATA}} -> {{.DEV_DATA}} (a copy - changes here do not flow back)"'

  dev:live:
    desc: Run YOUR build against the REAL store - requires `task stop` first, `task restart` after
    deps: [build]
    # No DATA_DIR override, so this opens the real store. The precondition exists because the raw
    # failure is a store lock error that does not say what to do about it.
    preconditions:
      - sh: '! pgrep -f "supragnosis serve" >/dev/null'
        msg: "a daemon is holding the store (one writer at a time). `task stop` first, `task restart` when done - or use `task dev:snapshot` to work on a copy without stopping anything."
    cmds:
      - >-
        SUPRAGNOSIS_BIN={{.SERVER_BIN}}
        SUPRAGNOSIS_VIZ_SOCK={{.DEV_SOCK}}
        SUPRAGNOSIS_HTTP_ADDR={{.DEV_HTTP}}
        cargo run --manifest-path app/Cargo.toml

  app:
    desc: Shell against the ALREADY-RUNNING daemon - builds nothing, shows that daemon's build
    cmds: [cargo run --manifest-path app/Cargo.toml]

  # --- quality gate -----------------------------------------------------------------------------

  sandbox:up:
    desc: Two-node federation sandbox on YOUR tree - browser at 127.0.0.1:7531 (spoke) / :7521 (hub)
    cmds:
      - docker compose -f deploy/docker/compose.sandbox.yaml up -d --build
      - 'echo "spoke viewer: http://127.0.0.1:7531   hub viewer: http://127.0.0.1:7521"'

  sandbox:down:
    desc: Stop the sandbox and delete its volumes - never touches ~/.supragnosis or the real hub stack
    cmds:
      - docker compose -f deploy/docker/compose.sandbox.yaml down -v --remove-orphans

  sandbox:seed:
    desc: Put knowledge in both sandbox nodes and sync it - idempotent, re-runnable
    cmds:
      - sh deploy/docker/sandbox-seed.sh

  sandbox:logs:
    desc: Follow the sandbox daemons (both nodes)
    cmds:
      - docker compose -f deploy/docker/compose.sandbox.yaml logs -f hub spoke

  sandbox:surface:
    desc: The spoke's negotiated surface as JSON - the three buckets the panel renders
    cmds:
      - 'curl -sS http://127.0.0.1:7531/api/federation | python3 -m json.tool'

  check:
    desc: The full gate - clippy, viewer ESLint, tests. Same checks CI runs, so run it before pushing.
    cmds:
      - task: fmt
      - task: lint
      - task: lint:web
      - task: test

  fmt:
    desc: rustfmt over both workspaces, check-only (matches the rust.yml fmt step exactly)
    # Settings live in rustfmt.toml. `task fmt:write` applies them; this one only reports.
    # Two calls: the desktop shell is a separate workspace and `--all` covers one workspace.
    cmds:
      - cargo fmt --all -- --check
      - cargo fmt --manifest-path app/Cargo.toml --all -- --check

  fmt:write:
    desc: Apply rustfmt in place, both workspaces
    cmds:
      - cargo fmt --all
      - cargo fmt --manifest-path app/Cargo.toml --all

  lint:
    desc: cargo clippy over all targets, warnings denied (matches the rust.yml clippy step exactly)
    # Workspace lints deny clippy::all, but rustc lints stay at warn - dead_code among them, which
    # is what a guard that lost its #[test] becomes. Keep this identical to rust.yml.
    cmds: [cargo clippy --all-targets -- -D warnings]

  deny:
    desc: cargo-deny over both workspaces - advisories, licences, bans, sources (mirrors rust.yml)
    # Needs `cargo install cargo-deny`; CI uses the action. Config and reasoning live in deny.toml.
    cmds:
      - cargo deny --all-features check
      - cargo deny --manifest-path app/Cargo.toml --config deny.toml --all-features check

  lint:web:
    desc: ESLint no-unsanitized on the viewer assets - mirrors the frontend-lint workflow
    deps: [_web-deps]
    dir: crates/supragnosis-viz/assets
    cmds: [npm run lint]

  _web-deps:
    internal: true
    dir: crates/supragnosis-viz/assets
    cmds: [npm ci]
    status:
      - test -d node_modules

  test:
    desc: 'cargo test (the real-model suite is #[ignore]d - see test:e2e)'
    cmds: [cargo test]

  test:e2e:
    desc: 'Real-model scorecard - needs a local Ollama or an API key. Measures, does not guard.'
    cmds: [cargo test -p supragnosis-e2e -- --ignored --nocapture]

  # --- build ------------------------------------------------------------------------------------

  build:
    desc: cargo build of the workspace default members (the desktop app is excluded)
    cmds: [cargo build]

  build:semantic:
    desc: Build the CLI with local ONNX semantic search (downloads the fastembed model on first run)
    cmds: [cargo build -p supragnosis-cli --features fastembed]

  build:release:
    desc: Release binary - the same invocation release.yml uses
    cmds: [cargo build --release --locked --bin supragnosis]

  build:app:
    desc: Bundle the macOS universal .app - the same tauri step release.yml uses
    cmds: [npx --yes '@tauri-apps/cli@^2' build --target universal-apple-darwin]

  # --- inspecting a running node ----------------------------------------------------------------

  viz:
    desc: 'GET the viewer API over its unix socket, e.g. task viz -- /api/curation'
    cmds:
      - 'curl -sS --unix-socket {{.VIZ_SOCK}} "http://viz{{.CLI_ARGS | default "/api/graph"}}" | python3 -m json.tool'

  status:
    desc: Daemon status (pid + port health)
    deps: [build]
    cmds: ['{{.SERVER_BIN}} status']

  # reproject/migrate/sync below all refuse to share the store with a live daemon, so these exist to
  # make "stop the daemon first" an actual step rather than an instruction with no button.
  stop:
    desc: Stop the background daemon
    deps: [build]
    cmds: ['{{.SERVER_BIN}} stop']

  restart:
    desc: Restart the background daemon
    deps: [build]
    cmds: ['{{.SERVER_BIN}} restart']

  # --- maintenance (these need the daemon STOPPED - one writer at a time) -----------------------

  reproject:
    desc: Re-materialize the projection from the log. Stop the daemon first.
    deps: [build]
    cmds: ['{{.SERVER_BIN}} reproject {{.CLI_ARGS}}']

  migrate:
    desc: Re-create pre-0.1.x observations under the current content-address formula. Daemon stopped.
    deps: [build]
    cmds: ['{{.SERVER_BIN}} migrate {{.CLI_ARGS}}']

  sync:
    desc: One-shot federation sync round (needs supragnosis.toml). Daemon stopped.
    deps: [build]
    cmds: ['{{.SERVER_BIN}} sync {{.CLI_ARGS}}']

  identity:
    desc: Print this node's federation id and public key
    deps: [build]
    cmds: ['{{.SERVER_BIN}} identity {{.CLI_ARGS}}']

  # --- landing site -----------------------------------------------------------------------------

  site:
    desc: Preview the public landing page at http://127.0.0.1:8000 (static; NOT the viewer)
    dir: site
    # --bind is not optional: python's default is 0.0.0.0, which would publish the preview to the
    # whole LAN. Everything else in this project binds loopback or a unix socket; so does this.
    cmds: [python3 -m http.server 8000 --bind 127.0.0.1]

  # --- cleanup ----------------------------------------------------------------------------------

  clean:dev:
    desc: Remove the throwaway dev instance (db + socket) - quit `task dev`/`task server` first
    cmds:
      - rm -rf {{.DEV_DATA}} {{.DEV_SOCK}}
