[package]
name = "supragnosis-cli"
description = "supragnosis executable binary."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[[bin]]
name = "supragnosis"
path = "src/main.rs"

[features]
default = []
# Enables fastembed(ONNX local embedding). It is a heavy dependency, so opt-in - when off, it degrades to keyword search.
# In a build with it on, the runtime default embedder becomes fastembed (can be overridden via SUPRAGNOSIS_EMBED).
fastembed = ["supragnosis-embed/fastembed"]

[dependencies]
supragnosis-core.workspace = true
supragnosis-engine.workspace = true
supragnosis-store.workspace = true
supragnosis-embed.workspace = true
supragnosis-mcp.workspace = true
supragnosis-viz.workspace = true
# transport-streamable-http-server: MCP HTTP service of the standalone daemon (SUPRAGNOSIS_HTTP_ADDR).
rmcp = { workspace = true, features = ["transport-streamable-http-server"] }
# net: viewer/daemon TcpListener bind. io-util/sync/time: the stdio bridge's line relay, single
# writer and retry wait (docs/client-connect.md). Not in the workspace-wide set, so added locally.
tokio = { workspace = true, features = ["net", "io-util", "sync", "time"] }
# The stdio bridge's HTTP client to the local daemon. Already in the tree through the sync
# transport, so a direct dependency rather than a new compilation unit.
reqwest.workspace = true
# HTTP server that mounts the MCP streamable-http service (daemon mode).
axum.workspace = true
# The hub read tier's event stream (docs/remote-viewer.md Section 3.6) - a stream body built from the
# viewer's broadcast channel. Already in the tree through axum and rmcp, so a direct dependency rather
# than a new compilation unit.
futures-util = "0.3"
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
# Subcommand/flag CLI.
clap = { version = "4", features = ["derive"] }
# Federation wiring (M4 Phase 4): sync server/client + supragnosis.toml + node keypair generation.
supragnosis-sync = { workspace = true, features = ["http"] }
serde.workspace = true
serde_json.workspace = true
blake3.workspace = true
toml = "1.1"
# Format-preserving TOML edits: supragnosis.toml is a hand-maintained declaration with comments,
# so a narrowing written by the console must not reformat the operator's file. Already in the tree -
# `toml` is built on it - so this adds a direct dependency, not a compilation unit.
toml_edit = "0.25"
getrandom = "0.4"

# Background daemon (start): fork/setsid/pidfile/log redirect. Since unsafe_code=forbid, we do not
# implement it directly but delegate to a crate (internal unsafe is the dependency crate's concern). unix only.
[target.'cfg(unix)'.dependencies]
daemonize = "0.5"

[dev-dependencies]
# Golden stores are checked in gzipped (a 1 MB redb file is about 6 KB); tests/golden_stores.rs
# unpacks them. Already in the tree through the HTTP stack, so not a new compilation unit.
flate2 = "1"
