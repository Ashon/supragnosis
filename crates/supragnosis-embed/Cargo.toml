[package]
name = "supragnosis-embed"
description = "supragnosis embedding adapters. Deterministic hashing (zero deps) + fastembed(ONNX, feature)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[features]
default = []
# fastembed(ONNX local model) is a heavy dependency, so it is isolated as opt-in (Principle 19: degrade).
fastembed = ["dep:fastembed"]

[dependencies]
supragnosis-core.workspace = true
# Without its defaults: those pull native TLS for the model download, which on Linux links OpenSSL
# into a binary that otherwise links none (docs/semantic-retrieval.md Section 4), and the image
# models this crate never loads. The ONNX runtime is downloaded at build time as a static archive
# and verified against the hash pinned in ort-sys.
fastembed = { version = "7", optional = true, default-features = false, features = [
    "ort-download-binaries-rustls-tls",
    "hf-hub-rustls-tls",
] }
