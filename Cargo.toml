[workspace]
resolver = "2"
# e2e is a real-model end-to-end measurement suite, separate from the deliverables (crates/*).
members = ["crates/*", "e2e"]
# The desktop shell is its own workspace (app/Cargo.toml says why). Excluded explicitly rather than
# merely absent, so that adding a path dependency on it fails here instead of silently pulling 111
# Tauri packages back into this lockfile.
exclude = ["app"]

[workspace.package]
version = "0.2.2"
edition = "2021"
# The floor the DEPENDENCIES set, which is higher than anything this code needs. Our own two are
# trait upcasting (1.86), which makes the store port narrowable - `Arc<dyn KnowledgeStore>` ->
# `Arc<dyn AssertionStore>`, and with it Principle 1's "no API writes an unasserted fact" - and
# `int::is_multiple_of` (1.87) in core. What actually decides it is `oxc` (1.95), which
# supragnosis-viz takes as a build-dependency to minify the viewer assets in release builds, and
# `darling` (1.88) through rmcp-macros.
#
# It read 1.87 until 2026-08-02 and was wrong the day it was written: clippy's incompatible_msrv
# checks this workspace's code, never the graph, and CI only ever ran stable. The `msrv` job in
# rust.yml is what makes this line testable instead of aspirational - raise the number there and
# here together, and only after measuring.
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Ashon/supragnosis"
homepage = "https://supragnosis.dev"
readme = "README.md"
# crates.io caps both at five entries; keywords additionally at 20 characters each, and
# categories must come from the fixed slug list (a typo is a publish-time rejection, not a warning).
keywords = ["mcp", "knowledge-graph", "agent-memory", "event-sourcing", "local-first"]
categories = ["database-implementations", "data-structures"]

# Workspace-wide lints. Each crate inherits them via `[lints] workspace = true`.
# Pin clippy warnings to deny to prevent regression of the cleaned-up state.
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }

[workspace.dependencies]
# External
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1"
# Federation (M4 Phase 1): node identity / attestation signing (docs/federation.md Section 2/3).
ed25519-dalek = "2"
thiserror = "1"
anyhow = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std"] }
tracing = "0.1"
tracing-subscriber = "0.3"
rmcp = { version = "1.8", features = ["server", "transport-io", "macros"] }
# The embedded store: a pure-Rust B-tree (single writer + MVCC readers). No C/C++ toolchain, so
# the build needs no bindgen and cross-compiling is a target flag rather than a sysroot.
redb = "4"
# standalone daemon: HTTP server to mount the MCP streamable-http service (cli only).
axum = "0.8"
# Federation sync transport (M4 Phase 3, sync crate "http" feature only): in-process TLS + HTTP client.
axum-server = { version = "0.7", features = ["tls-rustls"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# Pin the process-level rustls CryptoProvider (axum-server pulls aws-lc-rs, reqwest pulls ring -
# with both features present rustls refuses to auto-select; we install ring explicitly).
rustls = { version = "0.23", default-features = false, features = ["ring"] }

# Internal (cross-crate). The `version` is dead weight for a path build and load-bearing only for a
# crates.io publish, which is exactly why it rots: nothing in a normal build reads it, so a stale one
# is invisible until the day it is not. It cannot inherit (`version.workspace` is not a thing inside
# `[workspace.dependencies]`), so the number above is repeated here by hand SEVEN times and the v0.2.2
# bump moved one of the eight places it lives.
#
# Today a stale requirement is harmless - `0.2.1` is a caret range and 0.2.2 satisfies it. At the next
# MINOR it stops being: `^0.2.1` does not match 0.3.0, so `cargo publish` fails on a manifest that has
# been wrong since the release before. `manifest_consistency.rs` is what makes the drift a red build at
# PR time instead of a discovery at publish time - keep these equal to [workspace.package].version.
supragnosis-core = { path = "crates/supragnosis-core", version = "0.2.2" }
supragnosis-store = { path = "crates/supragnosis-store", version = "0.2.2" }
supragnosis-sync = { path = "crates/supragnosis-sync", version = "0.2.2" }
supragnosis-engine = { path = "crates/supragnosis-engine", version = "0.2.2" }
supragnosis-embed = { path = "crates/supragnosis-embed", version = "0.2.2" }
supragnosis-mcp = { path = "crates/supragnosis-mcp", version = "0.2.2" }
supragnosis-viz = { path = "crates/supragnosis-viz", version = "0.2.2" }
