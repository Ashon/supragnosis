name: Bug report
description: Something behaves differently from what the docs say
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        If this is a security issue, please do not file it here. See
        [SECURITY.md](https://github.com/Ashon/supragnosis/blob/main/SECURITY.md).

  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what you got instead.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: |
        Commands or MCP tool calls, in order. If knowledge state matters, say what was in
        the store. Please do not paste real observation content if it is sensitive; a
        redacted shape is usually enough.
      render: shell
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `supragnosis --version`, or the commit if built from source.
    validations:
      required: true

  - type: dropdown
    id: install
    attributes:
      label: How installed
      options:
        - Homebrew
        - install.sh
        - Built from source
        - Other
    validations:
      required: true

  - type: dropdown
    id: surface
    attributes:
      label: Which surface
      options:
        - MCP over stdio
        - MCP over HTTP daemon
        - CLI subcommand
        - Viewer / desktop app
        - Federation sync
        - Not sure
    validations:
      required: true

  - type: input
    id: platform
    attributes:
      label: Platform
      placeholder: macOS 15 arm64 / Ubuntu 24.04 x86_64

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        Relevant lines from `~/.supragnosis/log`, or stderr for a foreground run.
      render: shell

  - type: checkboxes
    id: config
    attributes:
      label: Configuration
      options:
        - label: Built with `--features fastembed`
        - label: A `supragnosis.toml` is in use
        - label: This node syncs with at least one peer
        - label: The store was migrated from a pre-0.2 (Cozo) store
