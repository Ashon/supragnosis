name: release

# Pushing a v* tag builds the per-platform release binaries and attaches them to the GitHub Release
# as tar.gz + sha256. workflow_dispatch builds and packages without publishing, so the pipeline can
# be exercised without cutting a release.
#
# "Without publishing" means nothing reaches the GitHub Release, ghcr, or the Homebrew tap - every
# step that would is guarded on the tag ref, and the image build passes `push: false`. It does NOT
# mean the run has no outside effect: the app job's signing step is gated on whether the APPLE_*
# secrets exist rather than on the ref, so a dispatch with those secrets set submits the bundle to
# Apple's notary service like a real release does. That is deliberate - an unnotarized dry run would
# not prove the step that most often breaks - but it is worth knowing before triggering one.
#
# The prebuilt binaries are a default build: keyword plus hashing search. Local ONNX semantic search
# means building from source with `--features fastembed`, which is kept out of the release because
# the `ort` dependency it pulls is heavy.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Read-only by default; each job that publishes asks for exactly what it writes. A workflow-wide
# write grant handed every job's actions a token that could push, tag and release, including the
# ones that only check a version or render a formula. Every checkout also drops the token it would
# leave in .git/config: no job pushes to this repository with git, so no later step needs it there.
permissions:
  contents: read

jobs:
  # The tree agrees with itself already: manifest_consistency.rs (the rust gate) holds the workspace
  # version, the seven internal dependency requirements, app/Cargo.toml and server.json equal, on
  # every push. What no test can check is the one comparison that needs a TAG to exist - whether the
  # number they all agree on is the number being released.
  #
  # v0.2.2 is why this job exists. Its commit message says "a missed bump is a red build"; in fact
  # only server.json was checked, and the bump that was actually missed (the internal requirements)
  # was in neither place. Nothing here can publish, so it costs one runner-minute and gates every job
  # that can.
  manifest:
    name: manifest agrees with the tag
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: the workspace version is the tag
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME:-}"
          case "$tag" in
            v*) want="${tag#v}" ;;
            # workflow_dispatch has no tag. Nothing downstream publishes on that path, so there is
            # nothing to hold to a number - report and pass rather than invent one.
            *) echo "no v* tag on this run (${tag:-none}) - nothing to compare"; exit 0 ;;
          esac
          got=$(sed -n '/^\[workspace\.package\]/,/^\[/ s/^version *= *"\(.*\)"/\1/p' Cargo.toml | head -1)
          test -n "$got" || { echo "no version in [workspace.package]" >&2; exit 1; }
          test "$got" = "$want" || {
            echo "tag $tag releases $want but [workspace.package].version is $got" >&2
            echo "the release: commit must move the version with the tag" >&2
            exit 1; }
          echo "manifest agrees: $got"

  build:
    name: build ${{ matrix.target }}
    permissions:
      contents: write   # attach the binaries to the Release
    needs: manifest
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14        # Apple Silicon (arm64 runner)
            target: aarch64-apple-darwin
          - os: macos-14        # The Intel binary cross-compiles on the arm64 runner, which drops
            target: x86_64-apple-darwin   # any dependence on the scarce macos-13 Intel runner.
          # build on the oldest supported glibc (22.04 = 2.35) so the binary runs on
          # 22.04+ - ubuntu-latest(24.04) produced GLIBC_2.38+ binaries that fail on
          # 22.04 servers.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          # For ARM Linux servers (Graviton, Raspberry Pi). A native arm64 runner, so no cross
          # toolchain. The tap formula does not reference this target, so it is unrelated to the
          # tap update below.
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # rustup, which the runner image already has, rather than dtolnay/rust-toolchain: that action
      # publishes no version tags, only branches (stable, master), so a SHA pin would freeze it and
      # Dependabot could not move it.
      - name: install rust
        run: rustup toolchain install stable --profile minimal --target "${{ matrix.target }}" && rustup default stable

      # No cargo cache in this workflow: what it publishes is built from the tagged tree alone. A cache
      # a tag run saves is scoped to that tag, so these per-target ones never hit; the one that did
      # (the app's) was written by dev-app.yml on main, which put whatever any step there left in
      # target/ into the signed, notarized app.

      - name: build
        run: cargo build --release --locked --bin supragnosis --target ${{ matrix.target }}

      - name: package
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME:-dev}"
          name="supragnosis-${version}-${{ matrix.target }}"
          mkdir -p "dist/${name}"
          cp "target/${{ matrix.target }}/release/supragnosis" "dist/${name}/"
          cp README.md "dist/${name}/" 2>/dev/null || true
          tar -C dist -czf "dist/${name}.tar.gz" "${name}"
          # Checksums: sha256sum on Linux, shasum on macOS.
          cd dist
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${name}.tar.gz" > "${name}.tar.gz.sha256"
          else
            shasum -a 256 "${name}.tar.gz" > "${name}.tar.gz.sha256"
          fi

      # Uploaded on non-tag runs too (workflow_dispatch), so a build can be verified without a tag.
      - name: upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: supragnosis-${{ matrix.target }}
          path: dist/*.tar.gz*

      # The release body is docs/releases/<tag>.md, committed with the version bump and written by
      # hand for each release. Falls back to GitHub's generated notes when that file is absent.
      - name: resolve release notes
        id: notes
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          f="docs/releases/${GITHUB_REF_NAME}.md"
          if [ -f "$f" ]; then echo "path=$f" >> "$GITHUB_OUTPUT"; else echo "path=" >> "$GITHUB_OUTPUT"; fi

      # Assets attach only on a tag push; several jobs accumulate onto the same Release.
      - name: publish to release (committed notes)
        if: startsWith(github.ref, 'refs/tags/v') && steps.notes.outputs.path != ''
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          body_path: ${{ steps.notes.outputs.path }}
          files: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256

      - name: publish to release (auto notes)
        if: startsWith(github.ref, 'refs/tags/v') && steps.notes.outputs.path == ''
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256

  # Builds the desktop shell (.app, universal binary), signs and notarizes it, and attaches the zip
  # to the release. The Homebrew cask uses that zip as its source - there is no DMG, see
  # deploy/homebrew/README.md. Without the signing secrets (workflow_dispatch, a fork) it builds
  # unsigned and verifies nothing but the build.
  app:
    name: build desktop app (macos universal)
    permissions:
      contents: write   # attach the app to the Release
    needs: manifest
    # Pinned to macos-26: macOS 26 gates control metrics on the linked SDK, so an app built against
    # an older SDK gets the compatibility (legacy) traffic-light metrics and the y calibration for
    # the overlay titlebar's traffic lights (app/src/main.rs show_viewer) lands wrong. The app job
    # only - the server binaries have no UI.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: install rust
        run: rustup toolchain install stable --profile minimal --target aarch64-apple-darwin --target x86_64-apple-darwin && rustup default stable

      # The tauri CLI is app/package.json's exact version, its integrity held by package-lock.json,
      # and installed in a step that holds no secrets. It used to be `npx --yes @tauri-apps/cli@^2`:
      # whatever 2.x npm served that minute, run in a job whose environment held the Apple signing
      # certificate and the notarization password.
      - name: install the pinned tauri CLI
        working-directory: app
        run: npm ci --no-audit --no-fund

      # The signing secrets reach this step only. They used to be exported through GITHUB_ENV, which
      # handed them to every later step of the job - the packaging, the upload and release actions.
      # They are set only when they exist: empty strings make the bundler attempt signing and fail.
      # There is no frontend build step - the daemon serves the viewer and the shell is static assets.
      - name: build the desktop app (universal, signed when the secrets exist)
        working-directory: app
        shell: bash
        env:
          APPLE_CERTIFICATE_S: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD_S: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY_S: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID_S: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD_S: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID_S: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY_P8_S: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID_S: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_S: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          if [ -n "$APPLE_SIGNING_IDENTITY_S" ]; then
            for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_TEAM_ID; do
              s="${v}_S"
              export "$v=${!s}"
            done
            # Notarization uses the App Store Connect API key when it exists: a key is not tied to an
            # Apple ID login, so an account lock or a new app-specific password does not break the
            # build. Only one set is exported, because the bundler prefers the Apple ID when both are
            # present. Tauri reads APPLE_API_KEY as the key ID and the .p8 from APPLE_API_KEY_PATH.
            if [ -n "$APPLE_API_KEY_P8_S" ]; then
              key="${RUNNER_TEMP}/AuthKey_${APPLE_API_KEY_ID_S}.p8"
              (umask 077 && printf '%s\n' "$APPLE_API_KEY_P8_S" > "$key")
              export APPLE_API_KEY="$APPLE_API_KEY_ID_S" APPLE_API_ISSUER="$APPLE_API_ISSUER_S" APPLE_API_KEY_PATH="$key"
              echo "signing + notarization (App Store Connect API key) enabled"
            else
              export APPLE_ID="$APPLE_ID_S" APPLE_PASSWORD="$APPLE_PASSWORD_S"
              echo "signing + notarization (Apple ID) enabled"
            fi
          else
            echo "no APPLE_SIGNING_IDENTITY secret - building unsigned"
          fi
          npx --no-install tauri build --target universal-apple-darwin

      - name: package app zip
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME:-dev}"
          # app/target, not target: the desktop shell is its own workspace, so its build output no
          # longer lands in the root workspace's shared target directory. Checked explicitly because
          # the failure otherwise arrives as `ditto: Cannot get the real path`, which names the
          # symptom and not the cause.
          app="app/target/universal-apple-darwin/release/bundle/macos/Supragnosis.app"
          test -d "$app" || { echo "no bundle at $app - did the shell's workspace or target dir move?" >&2; exit 1; }
          name="Supragnosis-${version}-macos-universal.app.zip"
          mkdir -p dist
          # ditto rather than zip: it preserves resource forks and the signature, which is what
          # keeps the notarization staple intact.
          ditto -c -k --keepParent "$app" "dist/${name}"
          cd dist && shasum -a 256 "${name}" > "${name}.sha256"

      - name: upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: supragnosis-app-macos-universal
          path: dist/*.app.zip*

      - name: resolve release notes
        id: notes
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          f="docs/releases/${GITHUB_REF_NAME}.md"
          if [ -f "$f" ]; then echo "path=$f" >> "$GITHUB_OUTPUT"; else echo "path=" >> "$GITHUB_OUTPUT"; fi

      - name: publish to release (committed notes)
        if: startsWith(github.ref, 'refs/tags/v') && steps.notes.outputs.path != ''
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          body_path: ${{ steps.notes.outputs.path }}
          files: |
            dist/*.app.zip
            dist/*.app.zip.sha256

      - name: publish to release (auto notes)
        if: startsWith(github.ref, 'refs/tags/v') && steps.notes.outputs.path == ''
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
          files: |
            dist/*.app.zip
            dist/*.app.zip.sha256

  # Homebrew bottles for the server formula. The formula only copies the prebuilt binary, but
  # Homebrew treats a formula without a bottle as a source build: before installing it, it insists on
  # an up-to-date Xcode or Command Line Tools, and fails without them - which is how installing the
  # desktop app (whose cask depends on the formula) came to ask for Xcode. A bottle is poured
  # instead, with no such check (deploy/homebrew/README.md).
  #
  # Built the standard way - install from a local tap with --build-bottle, then `brew bottle` - and
  # proven by reinstalling from it and requiring that Homebrew poured it (deploy/homebrew/bottle.sh,
  # which homebrew.yml also runs on pull requests). macos-14 gives arm64_sonoma, which Homebrew also
  # pours on every later macOS;
  # ubuntu gives x86_64_linux. There is no Intel macOS runner (the Intel binary is cross-compiled),
  # so Intel Macs keep the source-build path. A bottle that fails to build is left out of the tap,
  # not a reason to hold the release back.
  bottle:
    name: homebrew bottle (${{ matrix.os }})
    permissions:
      contents: write   # attach the bottle to the Release
    needs: [build, app]
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: bottle the formula, and prove the bottle pours
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = Linux ]; then eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"; fi
          ./deploy/homebrew/bottle.sh "${GITHUB_REF_NAME}" bottle

      - name: attach the bottle to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" bottle/*.bottle.tar.gz --clobber

      - name: upload the bottle's description for the tap job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bottle-${{ matrix.os }}
          path: bottle/*.bottle.json

  # Once every release asset is attached, renders the formula and casks into the tap repository
  # (Ashon/homebrew-tap) from this tag's templates in deploy/homebrew, and pushes. The templates are
  # the source, so a change to one reaches `brew upgrade` with the release that carries it, not only
  # a new version and sha256 on the tap's old copy. update-tap.sh curls the .sha256
  # sidecars from the release, so this runs only after the build and app jobs have all finished. If
  # this job fails the release assets are already published - the manual fallback is the per-release
  # section of deploy/homebrew/README.md. Without the TAP_PUSH_TOKEN secret (a fine-grained PAT with
  # Contents write on Ashon/homebrew-tap and nothing else) it is skipped, the same way the APPLE_*
  # secrets are. It waits for the bottle job and renders whichever bottles it produced; it still
  # runs when a bottle failed, since a formula without that bottle is what users have today.
  # The container image, published so the MCP Registry has something to point at. Its ownership
  # proof is the io.modelcontextprotocol.server.name label baked into the image (deploy/docker),
  # which has to equal the `name` in server.json - a mismatch is not a broken build, it is a
  # registry entry that will not verify.
  #
  # Multi-arch, because a hub is as likely to be an arm64 box as an x86 one, and because an MCP
  # client on Apple silicon should not emulate.
  image:
    name: publish container image
    permissions:
      contents: read
      packages: write   # push the container image to ghcr.io
    needs: manifest
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: log in to ghcr
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Lowercase, because ghcr rejects an uppercase path and the account is `Ashon`. The version
      # drops the leading v: server.json names `ghcr.io/ashon/supragnosis:0.2.1`, and the tag here
      # is what that string has to match.
      - name: derive tags
        id: tags
        run: |
          set -euo pipefail
          repo=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          # A run by hand pushes nothing, but buildx still parses the tag, and a branch name such
          # as fix/x is not a valid one - so off a tag the version is a fixed placeholder.
          case "$GITHUB_REF_NAME" in
            v*) version="${GITHUB_REF_NAME#v}" ;;
            *) version="dry-run" ;;
          esac
          echo "image=ghcr.io/${repo}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          # Only a tag publishes. workflow_dispatch builds and proves the Dockerfile still works.
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: |
            ${{ steps.tags.outputs.image }}:${{ steps.tags.outputs.version }}
            ${{ steps.tags.outputs.image }}:latest

      # server.json names an exact image tag, so a release whose image and manifest disagree would
      # publish a registry entry pointing at something that does not exist. Checked here rather than
      # discovered by the first person who tries to install it.
      #
      # Tag-guarded like the publish steps, and for the same reason they are: `version` comes from
      # `${GITHUB_REF_NAME#v}`, which on a workflow_dispatch is the branch name. So this compared
      # `...:main` against `...:0.3.0` and failed by construction on every dispatch - meaning the
      # dry-run path this workflow's own header offers ("builds and packages without publishing, so
      # the pipeline can be exercised without cutting a release") could never come back green, and
      # the one job it exists to prove - the container build - was the job it reddened. Nothing is
      # lost by the guard: manifest_consistency.rs holds server.json equal to the workspace version
      # on every push, and the comparison that genuinely needs a tag still runs on every tag.
      - name: server.json names this image
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          want="${{ steps.tags.outputs.image }}:${{ steps.tags.outputs.version }}"
          got=$(python3 -c "import json;print(json.load(open('server.json'))['packages'][0]['identifier'])")
          test "$want" = "$got" || {
            echo "server.json points at $got but this release publishes $want" >&2; exit 1; }
          v=$(python3 -c "import json;print(json.load(open('server.json'))['version'])")
          test "$v" = "${{ steps.tags.outputs.version }}" || {
            echo "server.json version $v does not match the tag" >&2; exit 1; }
          echo "server.json agrees: $got"

  tap:
    name: update homebrew tap
    needs: [build, app, bottle]
    if: >-
      always() && startsWith(github.ref, 'refs/tags/v')
      && needs.build.result == 'success' && needs.app.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: collect the bottles that were built
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          pattern: bottle-*
          path: bottles
          merge-multiple: true

      - name: update tap (when token exists)
        shell: bash
        env:
          TAP_PUSH_TOKEN: ${{ secrets.TAP_PUSH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$TAP_PUSH_TOKEN" ]; then
            echo "no TAP_PUSH_TOKEN secret - skipping (manual: deploy/homebrew/update-tap.sh ${GITHUB_REF_NAME})"
            exit 0
          fi
          git clone --depth 1 "https://x-access-token:${TAP_PUSH_TOKEN}@github.com/Ashon/homebrew-tap" tap
          ./deploy/homebrew/update-tap.sh "${GITHUB_REF_NAME}" tap bottles
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula Casks
          git commit -m "supragnosis ${GITHUB_REF_NAME}"
          git push
