name: release

# Pushing a v* tag builds the per-platform release binaries and attaches them to the GitHub Release
# as tar.gz + sha256, bottles the server formula and publishes the container image. The desktop app
# and the Homebrew tap are released from the same tag outside this repository, once this run has
# finished (deploy/homebrew/README.md). workflow_dispatch builds and packages without publishing, so
# the pipeline can be exercised without cutting a release.
#
# "Without publishing" means nothing reaches the GitHub Release or ghcr - every step that would is
# guarded on the tag ref, and the image build passes `push: false`.
#
# The prebuilt binaries are a default build: keyword search only. Local ONNX semantic search
# means building from source with `--features fastembed`, which is kept out of the release because
# the `ort` dependency it pulls is heavy.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Read-only by default; each job that publishes asks for exactly what it writes. A workflow-wide
# write grant handed every job's actions a token that could push, tag and release, including the
# ones that only check a version or render a formula. Every checkout also drops the token it would
# leave in .git/config: no job pushes to this repository with git, so no later step needs it there.
permissions:
  contents: read

jobs:
  # The tree agrees with itself already: manifest_consistency.rs (the rust gate) holds the workspace
  # version, the seven internal dependency requirements, app/Cargo.toml and server.json equal, on
  # every push. What no test can check is the one comparison that needs a TAG to exist - whether the
  # number they all agree on is the number being released.
  #
  # v0.2.2 is why this job exists. Its commit message says "a missed bump is a red build"; in fact
  # only server.json was checked, and the bump that was actually missed (the internal requirements)
  # was in neither place. Nothing here can publish, so it costs one runner-minute and gates every job
  # that can.
  manifest:
    name: manifest agrees with the tag
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: the workspace version is the tag
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME:-}"
          case "$tag" in
            v*) want="${tag#v}" ;;
            # workflow_dispatch has no tag. Nothing downstream publishes on that path, so there is
            # nothing to hold to a number - report and pass rather than invent one.
            *) echo "no v* tag on this run (${tag:-none}) - nothing to compare"; exit 0 ;;
          esac
          got=$(sed -n '/^\[workspace\.package\]/,/^\[/ s/^version *= *"\(.*\)"/\1/p' Cargo.toml | head -1)
          test -n "$got" || { echo "no version in [workspace.package]" >&2; exit 1; }
          test "$got" = "$want" || {
            echo "tag $tag releases $want but [workspace.package].version is $got" >&2
            echo "the release: commit must move the version with the tag" >&2
            exit 1; }
          echo "manifest agrees: $got"

  build:
    name: build ${{ matrix.target }}
    permissions:
      contents: write   # attach the binaries to the Release
    needs: manifest
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple silicon only. Intel Macs have no release binary: they build from source
          # (deploy/homebrew/README.md).
          - os: macos-14
            target: aarch64-apple-darwin
          # build on the oldest supported glibc (22.04 = 2.35) so the binary runs on
          # 22.04+ - ubuntu-latest(24.04) produced GLIBC_2.38+ binaries that fail on
          # 22.04 servers.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          # For ARM Linux servers (Graviton, Raspberry Pi). A native arm64 runner, so no cross
          # toolchain. The tap formula installs this tarball on arm64 Linux, so rendering the
          # formula (the bottle job below, and the tap update after this run) needs its sum.
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # rustup, which the runner image already has, rather than dtolnay/rust-toolchain: that action
      # publishes no version tags, only branches (stable, master), so a SHA pin would freeze it and
      # Dependabot could not move it.
      - name: install rust
        run: rustup toolchain install stable --profile minimal --target "${{ matrix.target }}" && rustup default stable

      # No cargo cache in this workflow: what it publishes is built from the tagged tree alone, and a
      # cache a tag run saves is scoped to that tag, so these per-target ones would never hit.

      - name: build
        run: cargo build --release --locked --bin supragnosis --target ${{ matrix.target }}

      - name: package
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME:-dev}"
          name="supragnosis-${version}-${{ matrix.target }}"
          mkdir -p "dist/${name}"
          cp "target/${{ matrix.target }}/release/supragnosis" "dist/${name}/"
          cp README.md "dist/${name}/" 2>/dev/null || true
          tar -C dist -czf "dist/${name}.tar.gz" "${name}"
          # Checksums: sha256sum on Linux, shasum on macOS.
          cd dist
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${name}.tar.gz" > "${name}.tar.gz.sha256"
          else
            shasum -a 256 "${name}.tar.gz" > "${name}.tar.gz.sha256"
          fi

      # Uploaded on non-tag runs too (workflow_dispatch), so a build can be verified without a tag.
      - name: upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: supragnosis-${{ matrix.target }}
          path: dist/*.tar.gz*

      # The release body is docs/releases/<tag>.md, committed with the version bump and written by
      # hand for each release. Falls back to GitHub's generated notes when that file is absent.
      - name: resolve release notes
        id: notes
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          f="docs/releases/${GITHUB_REF_NAME}.md"
          if [ -f "$f" ]; then echo "path=$f" >> "$GITHUB_OUTPUT"; else echo "path=" >> "$GITHUB_OUTPUT"; fi

      # Assets attach only on a tag push; several jobs accumulate onto the same Release.
      - name: publish to release (committed notes)
        if: startsWith(github.ref, 'refs/tags/v') && steps.notes.outputs.path != ''
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          body_path: ${{ steps.notes.outputs.path }}
          files: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256

      - name: publish to release (auto notes)
        if: startsWith(github.ref, 'refs/tags/v') && steps.notes.outputs.path == ''
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256

  # Homebrew bottles for the server formula. The formula only copies the prebuilt binary, but
  # Homebrew treats a formula without a bottle as a source build: before installing it, it insists on
  # an up-to-date Xcode or Command Line Tools, and fails without them - which is how installing the
  # desktop app (whose cask depends on the formula) came to ask for Xcode. A bottle is poured
  # instead, with no such check (deploy/homebrew/README.md).
  #
  # Built the standard way - install from a local tap with --build-bottle, then `brew bottle` - and
  # proven by reinstalling from it and requiring that Homebrew poured it (deploy/homebrew/bottle.sh,
  # which homebrew.yml also runs on pull requests). macos-14 gives arm64_sonoma, which Homebrew also
  # pours on every later macOS;
  # ubuntu gives x86_64_linux. arm64 Linux, which this matrix does not bottle, keeps the
  # source-build path. A bottle that fails to build is left out of the tap, not a reason to hold the
  # release back.
  bottle:
    name: homebrew bottle (${{ matrix.os }})
    permissions:
      contents: write   # attach the bottle to the Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: bottle the formula, and prove the bottle pours
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = Linux ]; then eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"; fi
          ./deploy/homebrew/bottle.sh "${GITHUB_REF_NAME}" bottle

      - name: attach the bottle to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" bottle/*.bottle.tar.gz --clobber

      - name: upload the bottle's description for rendering the tap
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bottle-${{ matrix.os }}
          path: bottle/*.bottle.json

  # The container image, published so the MCP Registry has something to point at. Its ownership
  # proof is the io.modelcontextprotocol.server.name label baked into the image (deploy/docker),
  # which has to equal the `name` in server.json - a mismatch is not a broken build, it is a
  # registry entry that will not verify.
  #
  # Multi-arch, because a hub is as likely to be an arm64 box as an x86 one, and because an MCP
  # client on Apple silicon should not emulate. Each architecture builds on a native runner of its
  # own, as the binaries above do, and is pushed by digest; `image-manifest` then names both digests
  # under the release's tags. The arm64 half used to build under QEMU on the x86 runner, which held
  # the release for over an hour.
  image:
    name: container image (${{ matrix.platform }})
    permissions:
      contents: read
      packages: write   # push the image, by digest, to ghcr.io
    needs: manifest
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux/amd64
            arch: amd64
          - os: ubuntu-22.04-arm
            platform: linux/arm64
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: log in to ghcr
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Lowercase, because ghcr rejects an uppercase path and the account is `Ashon`.
      - name: derive the image name
        id: name
        run: |
          set -euo pipefail
          echo "image=ghcr.io/$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      # Only a tag publishes. workflow_dispatch builds and proves the Dockerfile still works.
      - name: build, and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ steps.name.outputs.image }},push-by-digest=true,name-canonical=true,push=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: record the digest
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${DIGEST#sha256:}"

      - name: hand the digest to the manifest job
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # One image, both architectures: a manifest list under the version tag and `latest`, built from
  # the digests the per-arch jobs pushed. A tag only - a run by hand pushed nothing to name.
  image-manifest:
    name: publish container image
    permissions:
      contents: read
      packages: write   # push the manifest list to ghcr.io
    needs: image
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: collect the digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: image-digest-*
          merge-multiple: true
          path: ${{ runner.temp }}/digests

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: log in to ghcr
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The version drops the leading v: server.json names `ghcr.io/ashon/supragnosis:0.2.1`, and the
      # tag here is what that string has to match.
      - name: derive tags
        id: tags
        run: |
          set -euo pipefail
          echo "image=ghcr.io/$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: tag both architectures as one image
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE: ${{ steps.tags.outputs.image }}
          VERSION: ${{ steps.tags.outputs.version }}
        run: |
          set -euo pipefail
          test "$(ls | wc -l)" -eq 2 || { echo "expected two digests, found: $(ls)" >&2; exit 1; }
          # shellcheck disable=SC2046 # one argument per digest file
          docker buildx imagetools create -t "${IMAGE}:${VERSION}" -t "${IMAGE}:latest" \
            $(printf "${IMAGE}@sha256:%s " *)
          docker buildx imagetools inspect "${IMAGE}:${VERSION}"

      # server.json names an exact image tag, so a release whose image and manifest disagree would
      # publish a registry entry pointing at something that does not exist. Checked here rather than
      # discovered by the first person who tries to install it. Tag-only like the job: the version
      # comes from the tag, and manifest_consistency.rs holds server.json equal to the workspace
      # version on every push.
      - name: server.json names this image
        env:
          IMAGE: ${{ steps.tags.outputs.image }}
          VERSION: ${{ steps.tags.outputs.version }}
        run: |
          set -euo pipefail
          want="${IMAGE}:${VERSION}"
          got=$(python3 -c "import json;print(json.load(open('server.json'))['packages'][0]['identifier'])")
          test "$want" = "$got" || {
            echo "server.json points at $got but this release publishes $want" >&2; exit 1; }
          v=$(python3 -c "import json;print(json.load(open('server.json'))['version'])")
          test "$v" = "$VERSION" || {
            echo "server.json version $v does not match the tag" >&2; exit 1; }
          echo "server.json agrees: $got"
