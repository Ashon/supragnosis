name: pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "scripts/install.sh"
      - ".github/workflows/pages.yml"
  # The hero badge names the latest release, so publishing one has to redeploy - and a tag push does
  # not reach this workflow, which is branch-filtered.
  #
  # It chains off the release WORKFLOW rather than the release EVENT. release.yml creates the release
  # with GITHUB_TOKEN, and an event raised by that token does not start a workflow run - a documented
  # rule, and one this repo learned by shipping v0.2.0 with the landing page still naming v0.1.21.
  # `workflow_run` is the supported way to chain, and it fires because the upstream run came from a
  # real tag push. The `release` trigger stays for a release published by hand, where it does work.
  workflow_run:
    workflows: [release]
    types: [completed]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    # workflow_run fires whatever the upstream conclusion was; a failed release build has nothing to
    # advertise, and redeploying then would stamp a tag whose binaries do not exist.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      # Publish the install bootstrap at https://supragnosis.dev/install.sh from its single source
      # (scripts/install.sh) - copied into the artifact so there is no duplicate file in the repo.
      - name: stage the install bootstrap into the site
        run: cp scripts/install.sh site/install.sh
      # The badge in the checked-in HTML is only a placeholder; the deployed page always shows
      # the latest release tag. The badge sits in "Project facts" beside the install command, so it
      # has to name what a visitor can install. It read the workspace version until main moved ahead
      # of the last tag, and then the page advertised a v0.2.0 with no download behind it.
      - name: stamp the latest release into the hero badge
        env:
          # Authenticated, because an anonymous API call from a runner shares its rate limit with
          # every other runner on that IP and comes back 403 - which is how the v0.2.1 deploy failed
          # after the trigger had just been fixed. `contents: read` above is all this needs.
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(gh api "repos/${{ github.repository }}/releases/latest" --jq .tag_name)
          test -n "$version" || { echo "could not read the latest release tag" >&2; exit 1; }
          before=$(grep -c 'id="version-badge"' site/index.html)
          test "$before" -eq 1 || { echo "expected exactly one version-badge, found $before" >&2; exit 1; }
          sed -i "s|<li id=\"version-badge\">[^<]*</li>|<li id=\"version-badge\">${version}</li>|" site/index.html
          grep -o '<li id="version-badge">[^<]*</li>' site/index.html
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
