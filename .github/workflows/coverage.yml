# Line coverage of the server workspace, published as the README's badge.
#
# What the number is: the share of Rust lines in crates/* that `cargo test` runs, measured by
# cargo-llvm-cov on the same default members and features the rust.yml gate tests. What it is not:
# the viewer's JavaScript, the desktop shell (its own workspace), and the e2e harness, whose
# real-model tests are #[ignore]d and so would only count as lines nothing runs. It is a reading,
# not a gate: no threshold fails a build, because a number held as a target gets tests written for
# the number.
#
# The badge is a shields.io endpoint document on the `badges` branch, which holds the badges' files
# and nothing else. Measuring and publishing are separate jobs so that the token that can write to the
# repository never sits in a job that compiles and runs the code under test.
name: coverage

on:
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "e2e/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/coverage.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coverage
  cancel-in-progress: true

jobs:
  measure:
    name: line coverage
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: install rust
        run: rustup toolchain install stable --profile minimal -c llvm-tools-preview && rustup default stable

      - name: cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: coverage

      # Built from source at a pinned version, like every other tool here, rather than through a
      # third-party installer action; the cache above keeps ~/.cargo/bin, so it is built once.
      - name: install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --version 0.9.1 --locked

      - name: measure
        run: cargo llvm-cov --locked --ignore-filename-regex '(^|/)e2e/' --json --summary-only --output-path coverage.json

      - name: write the badge
        run: |
          set -euo pipefail
          pct=$(jq -r '.data[0].totals.lines.percent' coverage.json)
          shown=$(printf '%.1f' "$pct")
          color=$(awk -v p="$pct" 'BEGIN { print (p >= 90 ? "brightgreen" : p >= 80 ? "green" : p >= 70 ? "yellowgreen" : p >= 60 ? "yellow" : "orange") }')
          jq -n --arg m "${shown}%" --arg c "$color" \
            '{schemaVersion: 1, label: "coverage", message: $m, color: $c}' > badge.json
          cat badge.json
          {
            echo "### Line coverage: ${shown}%"
            echo
            echo "| File | Lines | Covered |"
            echo "|---|---:|---:|"
            jq -r '.data[0].files[] | [(.filename | sub(".*/(?<p>(crates|e2e)/)"; "\(.p)")), .summary.lines.count, (.summary.lines.percent * 10 | round / 10 | tostring + "%")] | "| \(.[0]) | \(.[1]) | \(.[2]) |"' coverage.json
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-badge
          path: badge.json
          retention-days: 7

  publish:
    name: publish the badge
    needs: measure
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    # The one job that writes: it replaces its own file on the badges branch, keeping the other
    # badges there. It checks out nothing and runs no code from the tree.
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-badge

      - name: name the badge
        run: mv badge.json coverage.json

      - name: push to the badges branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          FILE: coverage.json
        run: |
          set -euo pipefail
          # The badges branch is one commit holding every badge's file. This replaces its own file
          # and keeps the others; the lease is the commit it read, so a publish racing another one
          # (coverage.yml and scenarios.yml both run on a main push) reads again and retries.
          export GIT_AUTHOR_NAME="github-actions[bot]" GIT_COMMITTER_NAME="github-actions[bot]"
          export GIT_AUTHOR_EMAIL="41898282+github-actions[bot]@users.noreply.github.com"
          export GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
          new="$PWD/$FILE"
          work=$(mktemp -d) && cd "$work" && git init -q
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          for attempt in 1 2 3 4 5; do
            rm -rf tree .git/index && mkdir tree
            base=""
            if git fetch -q --depth=1 origin badges 2>/dev/null; then
              base=$(git rev-parse FETCH_HEAD)
              git --work-tree=tree checkout -q "$base" -- .
              rm -f .git/index
            fi
            cp "$new" "tree/$FILE"
            git --work-tree=tree add -A
            commit=$(git commit-tree "$(git write-tree)" -m "$FILE at ${SHA}")
            if git push -q --force-with-lease="refs/heads/badges:${base}" origin "${commit}:refs/heads/badges"; then
              exit 0
            fi
            sleep $((attempt * 3))
          done
          exit 1
