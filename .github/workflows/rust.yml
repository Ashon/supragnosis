# The Rust gate. Until this existed, CI built release binaries and linted the viewer's JS but never
# ran clippy or a single test - so every "guarded by <test>" claim in docs/architecture.md Section 14
# held only as long as a human remembered to run them locally. That is how a P16 determinism guard
# (aliases_accumulate_and_converge) sat failing ~1 in 8 runs without anyone noticing.
#
# This mirrors `task check` (Taskfile.yml), minus the viewer ESLint half, which frontend-lint.yml
# already owns. Keep the two in step: a check added here should be added there, and vice versa.
name: rust

on:
  push:
    paths:
      - "crates/**"
      - "e2e/**"
      - "app/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/rust.yml"
      # The supply-chain job reads deny.toml, so an edit to the gate's own configuration has to run
      # the gate. Without this an allow list could be widened, or an advisory ignored, and nothing
      # would check the result until the next unrelated push happened to land.
      - "deny.toml"
      # principle_coverage.rs include_str!s the design documents (the principle registry reads
      # principles.md, and the doc-claim sweep reads the rest), so editing one can fail the Rust
      # gate - the gate has to run when they change, or the coupling is one-way again.
      - "docs/*.md"
  pull_request:
    paths:
      - "crates/**"
      - "e2e/**"
      - "app/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/rust.yml"
      # The supply-chain job reads deny.toml, so an edit to the gate's own configuration has to run
      # the gate. Without this an allow list could be widened, or an advisory ignored, and nothing
      # would check the result until the next unrelated push happened to land.
      - "deny.toml"
      # principle_coverage.rs include_str!s the design documents (the principle registry reads
      # principles.md, and the doc-claim sweep reads the rest), so editing one can fail the Rust
      # gate - the gate has to run when they change, or the coupling is one-way again.
      - "docs/*.md"
  # The gate can go red with no change to the tree: a locked crate is yanked, an advisory is
  # published against one, or `stable` moves and a new lint fires. All three happened between
  # v0.4.1 and v0.4.2. The deny job had been red on main since the v0.4.1 release commit itself, and
  # RUSTSEC-2026-0285 (rustls, under the sync transport) went unreported for three weeks, because
  # the paths above only run the gate when something touches them. A weekly run on the default
  # branch reports drift when it arrives, instead of on whichever unrelated pull request trips it.
  schedule:
    - cron: "17 3 * * 1"   # Mondays 03:17 UTC
  # The same check on demand, e.g. right before cutting a release.
  workflow_dispatch:

# A gate reads the code and reports; it never writes to the repository. Declaring that explicitly
# means the token this job hands to third-party actions (the toolchain installer, the cache) cannot
# push, tag or open anything, whatever the repository-wide default happens to be set to.
permissions:
  contents: read

# A newer push supersedes an in-flight run on the same ref - the gate should report on the tip, not
# burn minutes finishing an answer about a commit nobody is waiting on any more.
concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: clippy + tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: install rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: rust-check

      # rustfmt.toml exists so this check has one answer; before it, the tree had drifted to ~620
      # divergent blocks with nothing checking.
      #
      # Two invocations because the desktop shell is its own workspace: `--all` means every member of
      # ONE workspace, so the root call does not reach app/ and its drift would go unseen. Verified by
      # breaking a file there and watching the root call pass. rustfmt only parses, so this needs
      # none of the platform toolchain that compiling the shell would.
      - name: fmt
        run: |
          cargo fmt --all -- --check
          cargo fmt --manifest-path app/Cargo.toml --all -- --check

      # Workspace lints deny clippy::all, but that leaves every rustc lint at warn - including
      # dead_code, which is exactly what an un-#[test]ed guard becomes. principle_coverage.rs now
      # rejects that case on its own; -D warnings is the general form, so the next lint that means
      # "this code no longer runs" fails the gate instead of scrolling past in a log.
      # -D goes after -- so it applies to the workspace crates, not to dependency builds.
      - name: clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      # Default members only (the desktop app needs platform webview toolchains and is covered by
      # dev-app.yml / release.yml). The e2e suite compiles here but its real-model tests are
      # #[ignore]d, so this runs the deliverables' tests, not a scorecard against a live model.
      - name: tests
        run: cargo test --locked

  # The declared floor, tested instead of asserted. `rust-version` read 1.87 for a day and was wrong
  # when it was written: clippy's incompatible_msrv lints this workspace's own code and never the
  # dependency graph, and the gate above only ever ran stable. What actually sets the floor is `oxc`
  # (1.96 since 0.152), a build-dependency of supragnosis-viz, and `darling` (1.88) through rmcp-macros.
  #
  # The toolchain comes from the manifest rather than a literal here, so there is one number to
  # change and this job fails when it is optimistic.
  #
  # Server workspace only. The desktop shell is a separate workspace with its own floor and cannot
  # be compiled on this runner (it needs the platform webview toolchain - see dev-app.yml, macOS).
  msrv:
    name: declared msrv builds
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: read the declared floor
        id: msrv
        run: |
          set -euo pipefail
          v=$(sed -n '/^\[workspace\.package\]/,/^\[/ s/^rust-version *= *"\(.*\)"/\1/p' Cargo.toml | head -1)
          test -n "$v" || { echo "no rust-version in [workspace.package]" >&2; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "declared floor: $v"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv

      # --all-targets so the tests count too: they are part of what a contributor on the floor runs,
      # and principle_coverage.rs include_str!s the design docs, which only compiles under a test
      # target. --locked because the shipped lockfile is the graph being claimed.
      - name: check
        run: cargo check --locked --all-targets

  # The `fastembed` feature is opt-in, and nothing else here builds it: not clippy, not the tests,
  # not the msrv check, not the release binaries. So the one adapter that talks to a real model
  # compiled only when someone built it by hand - fastembed 7 went green in every job above and did
  # not compile (#54). This compiles and lints the feature through the CLI, which is how a user
  # turns it on. It does not run the model: the real-model tests stay #[ignore]d because they
  # download weights, so this holds the API boundary, not the embeddings themselves.
  fastembed:
    name: fastembed feature builds
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: install rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: rust-fastembed

      - name: clippy (fastembed)
        run: cargo clippy --locked -p supragnosis-cli --features fastembed --all-targets -- -D warnings

  # SECURITY.md states a threat model in detail; a project that does that and gates nothing on what
  # its dependencies carry is asymmetric. deny.toml carries the reasoning, including why an
  # unmaintained crate three levels down is upstream's schedule and one in a manifest here is not.
  #
  # Both workspaces, one config: the desktop shell has its own tree, and a licence or a git source
  # arriving through it is the same problem arriving somewhere the root check cannot see.
  supply-chain:
    name: cargo-deny
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      # --all-features on both: the optional `fastembed` tree carries licences the default feature
      # set never resolves, and a gate that does not see them is a gate against the easy half.
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          manifest-path: Cargo.toml
          arguments: --all-features
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          manifest-path: app/Cargo.toml
          arguments: --all-features --config deny.toml
