<!doctype html>
<!-- The Welcome page (docs/onboarding.md Section 6): the first run, from install to the first entry.
     The app's own page, shown in the main window in place of the graph - nothing here is served by a
     daemon or a hub - and one of the two pages the app's commands answer. Every step's state on it
     is what `supragnosis setup --events` reported (O4). The policy is the settings page's. Everything
     below the header is built by welcome.js. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src ipc: http://ipc.localhost; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; object-src 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Setup - Supragnosis</title>
<link rel="stylesheet" href="fonts/pretendard-1.3.9/pretendard-latin.css">
<link rel="stylesheet" href="shell.css" data-shell>
<link rel="stylesheet" href="settings.css">
<link rel="stylesheet" href="welcome.css">
</head>
<body>
<!-- The viewer's title bar, as on the Settings page (design-system.md Section 6a, U26). -->
<header>
  <div class="tlead">
    <span class="mark"><svg viewBox="16 16 32 32" width="14" height="14" aria-hidden="true"><g stroke="currentColor" stroke-width="4.44" stroke-linecap="round"><line x1="32" y1="32" x2="32" y2="19.9"/><line x1="32" y1="32" x2="43.5" y2="28.3"/><line x1="32" y1="32" x2="39.1" y2="41.8"/><line x1="32" y1="32" x2="24.9" y2="41.8"/><line x1="32" y1="32" x2="20.5" y2="28.3"/></g></svg></span>
    <a id="close" class="tback" href="viz://localhost/" title="Back to the graph (Esc)"><span class="i i-back" aria-hidden="true"></span>Graph</a>
    <h1 id="pageTitle">Setup</h1>
  </div>
</header>
<main id="page" class="wpage" tabindex="-1"></main>
<!-- O6: what setup does stays on this Mac, and the page says so where every step can be seen. -->
<footer class="wfoot">
  <p class="privacy">Supragnosis keeps your memory on this Mac. It is shared only if you add a remote server or set up sync.</p>
  <div id="actions" class="wactions"></div>
</footer>
<div id="toasts" class="toasts" role="status" aria-live="polite"></div>
<!-- Each step's end, said to a screen reader as it happens (docs/design-system.md Section 10). -->
<div id="announce" class="sr-only" role="status" aria-live="polite"></div>
<script src="kit.js"></script>
<script src="welcome.js"></script>
</body>
</html>
