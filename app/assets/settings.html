<!doctype html>
<!-- The desktop app's settings page (docs/settings-page.md). The app's own page, shown in the main
     window in place of the graph - nothing here is served by a daemon or a hub - and the only page
     the settings commands answer. The policy below allows this page's own script, styles and icons,
     and Tauri's IPC, and nothing else. Everything below the header is built by settings.js. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src ipc: http://ipc.localhost; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; object-src 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Settings - supragnosis</title>
<link rel="stylesheet" href="shell.css" data-shell>
<link rel="stylesheet" href="settings.css">
</head>
<body>
<!-- The title bar, as the viewer draws it: the mark and the name, with the page's name after it. At
     the right end, the way back to the graph - the page is opened from the graph's gear, and closes
     back to it. -->
<header>
  <h1><svg viewBox="16 16 32 32" width="14" height="14" aria-hidden="true"><g stroke="currentColor" stroke-width="4.44" stroke-linecap="round"><line x1="32" y1="32" x2="32" y2="19.9"/><line x1="32" y1="32" x2="43.5" y2="28.3"/><line x1="32" y1="32" x2="39.1" y2="41.8"/><line x1="32" y1="32" x2="24.9" y2="41.8"/><line x1="32" y1="32" x2="20.5" y2="28.3"/></g></svg>supragnosis<span class="crumb">settings</span></h1>
  <a id="close" class="hclose" href="viz://localhost/" title="Back to the graph (Esc)" aria-label="Back to the graph"><span class="i i-x" aria-hidden="true"></span></a>
</header>
<div class="layout">
  <nav id="sidebar" class="sidebar" aria-label="Settings sections"></nav>
  <main id="pane" class="pane" tabindex="-1"></main>
</div>
<div id="toasts" class="toasts" role="status" aria-live="polite"></div>
<div id="dialogHost"></div>
<script src="settings.js"></script>
</body>
</html>
