# The desktop shell is its OWN workspace, not a member of the one above it.
#
# It shares no code with the server: it owns no engine and no store, and reaches the daemon over a
# unix socket - a process boundary, not a link boundary. What membership bought was inherited
# metadata; what it cost was one dependency graph. Tauri contributes 111 packages that nothing on
# the server side compiles, and they sat in the server's Cargo.lock, where a security advisory
# against a webview dependency reads as an advisory against the daemon.
#
# Cargo builds this from `app/`, which is where both release.yml and dev-app.yml already run
# (`working-directory: app`).
#
# The one thing membership did give for free is version sync, and it is now manual: the version
# below has to move with the workspace version above in the same `release:` commit, because the
# release ships them as one number (Supragnosis-vX.Y.Z-macos-universal.app.zip).

[workspace]
members = ["."]

[workspace.package]
version = "0.2.0"
edition = "2021"
# The shell's own floor, which is not the server's - a different dependency tree, and no reason to
# move when the server's does. Measured at the resolution level (cargo accepts the graph at 1.88 and
# refuses below it); a full compile check needs the platform webview toolchain, which is why CI
# builds this on macOS and the msrv job in rust.yml covers the server workspace only.
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Ashon/supragnosis"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }

[package]
name = "supragnosis-app"
description = "supragnosis desktop shell - a thin Tauri client over the daemon's unix-socket viewer."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
# The desktop shell is not a library and needs platform webview toolchains; it ships as a
# signed bundle from the release workflow, not from crates.io.
publish = false

[lints]
workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# The shell owns no engine and no store (single-process constraint: the daemon owns the db).
# It is webview + daemon lifecycle + a viz:// -> unix-socket proxy + the SSE event bridge.
# tray-icon + image-png: the shell lives in the menu bar (template tray mark, icons/tray.png).
tauri = { version = "2", features = ["tray-icon", "image-png"] }
anyhow = "1"
serde_json = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
# UnixStream + AsyncRead/Write + timeouts for the HTTP-over-UDS client and the SSE bridge.
tokio = { version = "1", features = ["net", "io-util", "time"] }
